{% extends 'base.html' %}

{% block content %}
<h1>Mano komentarai:</h1>
{% for comment in comments %}
<div class="d-flex mb-3">
    <div class="flex-shrink-0"><img class="rounded-circle" src="https://dummyimage.com/50x50/ced4da/6c757d.jpg" alt="..." /></div>
    <div class="ms-3">
        <div class="fw-bold">
            <a href="{% url 'post' comment.post.pk %}">
                {{ comment.post.title }}
            </a>
        </div>
        <div class="fw-bold">{{ comment.date | date:"Y-m-d H:m" }}</div>
        {{ comment.content }}
    </div>
</div>
{% endfor %}
{% endblock %}
