{% extends 'base.html' %}

{% block content %}
<h1>Vartotojo registracija</h1>
<form method="post" class="mb-2" enctype="multipart/form-data">
    {% csrf_token %}
    {% load crispy_forms_tags %}
    {{ form | crispy }}
    <button type="submit" class="btn btn-primary">Sukurti</button>
</form>
{% endblock %}
