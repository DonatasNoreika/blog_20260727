{% extends 'base.html' %}

{% block content %}
{% if user.photo %}
<img class="rounded-circle" src="{{ user.photo.url }}" width="50%">
{% endif %}
<h1>{{ user.username }} profilis</h1>
<form method="post" class="mb-2" enctype="multipart/form-data">
    {% csrf_token %}
    {% load crispy_forms_tags %}
    {{ form | crispy }}
    <button type="submit" class="btn btn-primary">Išsaugoti</button>
</form>
{% endblock %}
